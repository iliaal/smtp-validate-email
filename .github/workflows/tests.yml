name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint PHP
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: vendor/bin/phpunit
      - name: Install local SMTP fixture
        run: python -m pip install aiosmtpd
      - name: Local SMTP tests
        run: vendor/bin/phpunit --group e2e
